name: الطيار الآلي
on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'رابط الصوت المباشر (Google Drive أو Dropbox، عام لأي شخص معه الرابط)'
        required: false
        default: ''
      image_url:
        description: 'رابط صورة القارئ (اختياري)'
        required: false
        default: ''
      bgm_url:
        description: 'رابط الموسيقى الخلفية (اختياري)'
        required: false
        default: ''
      settings_url:
        description: 'رابط settings.json (اختياري، وإلا تُستخدم الافتراضية)'
        required: false
        default: ''
      reciter:
        description: 'اسم القارئ (اختياري)'
        required: false
        default: ''
      start_date:
        description: 'تاريخ أول نشر بصيغة YYYY-MM-DD'
        required: true
      time:
        description: 'ساعة النشر اليومية'
        required: true
        default: '19:00'
      tz:
        description: 'المنطقة الزمنية'
        required: true
        default: 'Asia/Riyadh'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix server
      - run: node server/run.mjs
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          ELEVEN_KEY: ${{ secrets.ELEVEN_KEY }}
          BP_KEY: ${{ secrets.BP_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          AUDIO_URL: ${{ inputs.audio_url }}
          IMAGE_URL: ${{ inputs.image_url }}
          BGM_URL: ${{ inputs.bgm_url }}
          SETTINGS_URL: ${{ inputs.settings_url }}
          RECITER: ${{ inputs.reciter }}
          START_DATE: ${{ inputs.start_date }}
          TIME: ${{ inputs.time }}
          TZ_ID: ${{ inputs.tz }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: out/
